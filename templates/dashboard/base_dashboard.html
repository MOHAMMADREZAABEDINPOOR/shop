{% extends 'base.html' %}

{% block content %}
<div class="container">
  <div class="admin-layout">

    <aside class="admin-sidebar">
      <div class="admin-brand">
        <span class="em-mark" style="width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,178,36,.12);border:1px solid rgba(255,178,36,.3);color:#FFC24B;"><svg aria-hidden="true" style="width:20px;height:20px"><use href="#i-grid"/></svg></span>
        <span>پنل مدیریت<br><small style="font-size:0.72rem;font-weight:400;color:#8A8A96;">{{ site_settings.site_name|default:"فروشگاه" }}</small></span>
      </div>
      <nav class="admin-nav">
        <a href="{% url 'dashboard:overview' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'overview' %}active{% endif %}"><svg class="icon" aria-hidden="true"><use href="#i-grid"/></svg> داشبورد اصلی</a>
        <a href="{% url 'dashboard:orders' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'orders' %}active{% endif %}"><svg class="icon" aria-hidden="true"><use href="#i-card"/></svg> سفارش‌ها</a>
        <a href="{% url 'dashboard:products' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'products' %}active{% endif %}"><svg class="icon" aria-hidden="true"><use href="#i-cart"/></svg> محصولات</a>
        <a href="{% url 'dashboard:product_create' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'product_create' %}active{% endif %}"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg> افزودن محصول</a>
        <a href="{% url 'dashboard:inventory' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'inventory' %}active{% endif %}"><svg class="icon" aria-hidden="true"><use href="#i-truck"/></svg> موجودی انبار</a>
        <a href="{% url 'dashboard:reports' %}" class="admin-nav-link {% if request.resolver_match.url_name == 'reports' %}active{% endif %}"><svg class="icon" aria-hidden="true"><use href="#i-star"/></svg> آمار و گزارش‌ها</a>
        <a href="/admin/" target="_blank" class="admin-nav-link"><svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg> ادمین جنگو ↗</a>
        <a href="{% url 'core:home' %}" class="admin-nav-link"><svg class="icon" aria-hidden="true"><use href="#i-arrow-start"/></svg> بازگشت به سایت</a>
      </nav>
    </aside>

    <div class="admin-main">
      {% block dashboard_content %}{% endblock %}
    </div>

  </div>
</div>
{% endblock %}
