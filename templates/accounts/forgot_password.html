{% extends 'base.html' %}
{% load static %}

{% block title %}فراموشی رمز عبور | {{ site_settings.site_name }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 440px; margin: 3rem auto;">

  <div class="card" style="padding: 2.25rem;">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div style="font-size: 2.2rem; margin-bottom: 0.5rem;">🔒</div>
      <h1 style="font-size: 1.4rem; font-weight: 800;">بازیابی رمز عبور</h1>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 0.25rem;">ایمیل حساب کاربری خود را وارد کنید تا لینک تغییر رمز برای شما ارسال شود</p>
    </div>

    <form method="POST" action="{% url 'accounts:forgot_password' %}">
      {% csrf_token %}
      <div class="form-group">
        <label class="form-label">آدرس ایمیل:</label>
        <input type="email" name="email" class="form-input" placeholder="example@domain.com" required autofocus>
      </div>

      <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1rem; margin-bottom: 1.5rem;">
        ارسال لینک بازیابی رمز عبور
      </button>

      <div style="text-align: center; font-size: 0.88rem; color: var(--text-secondary); border-top: 1px solid var(--border); padding-top: 1.25rem;">
        <a href="{% url 'accounts:login' %}" style="color: var(--primary); font-weight: 600;">← بازگشت به صفحه ورود</a>
      </div>
    </form>
  </div>

</div>
{% endblock %}
