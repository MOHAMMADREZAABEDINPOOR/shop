{% extends 'base.html' %}
{% load static shop_filters %}

{% block title %}{% tr 'Page Not Found' %} | {{ site_settings.site_name|default:"Shop" }}{% endblock %}

{% block content %}
<div class="container" style="max-width: 550px; margin: 4rem auto; text-align: center;">
  <div class="card" style="padding: 3rem 2rem;">
    <div style="font-size: 5rem; font-weight: 900; color: var(--primary); line-height: 1; margin-bottom: 1rem; font-family: var(--font-mono);">
      404
    </div>
    <h1 style="font-size: 1.4rem; font-weight: 800; margin-bottom: 0.75rem;">{% tr '404 Title' %}</h1>
    <p style="color: var(--text-muted); font-size: 0.95rem; margin-bottom: 2rem;">
      {% tr '404 Description' %}
    </p>
    <a href="{% url 'core:home' %}" class="btn btn-primary btn-lg">
      {% tr 'Back to Homepage' %}
    </a>
  </div>
</div>
{% endblock %}
